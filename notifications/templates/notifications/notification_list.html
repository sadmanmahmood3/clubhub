{% extends "base.html" %}

{% block title %}Notifications{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h1 class="h3 mb-0">Notifications</h1>
  {% if unread_notification_count %}
    <form method="post" action="{% url 'notifications:mark_all_read' %}">
      {% csrf_token %}
      <button class="btn btn-sm btn-outline-secondary">Mark all as read</button>
    </form>
  {% endif %}
</div>

<div class="list-group shadow-sm">
  {% for n in notifications %}
    <form method="post" action="{% url 'notifications:open' n.pk %}">
      {% csrf_token %}
      <button type="submit" class="list-group-item list-group-item-action d-flex justify-content-between align-items-start {% if not n.is_read %}fw-semibold{% endif %}">
        <span>
          {% if not n.is_read %}<i class="bi bi-circle-fill text-primary small me-1"></i>{% endif %}
          {{ n.message }}
        </span>
        <small class="text-muted ms-3 text-nowrap">{{ n.created_at|timesince }} ago</small>
      </button>
    </form>
  {% empty %}
    <div class="list-group-item text-muted">You have no notifications.</div>
  {% endfor %}
</div>
{% endblock %}
