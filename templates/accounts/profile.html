{% extends "base.html" %}

{% block title %}My profile{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-7">
    <h1 class="h3 mb-3">My profile</h1>
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <dl class="row mb-4">
          <dt class="col-sm-4">Username</dt><dd class="col-sm-8">{{ user.username }}</dd>
          <dt class="col-sm-4">Student ID</dt><dd class="col-sm-8">{{ user.student_id|default:"-" }}</dd>
          <dt class="col-sm-4">Role</dt><dd class="col-sm-8">{{ user.get_role_display }}</dd>
        </dl>
        <form method="post" novalidate>
          {% csrf_token %}
          {% include "partials/form_fields.html" with form=form %}
          <button type="submit" class="btn btn-primary">Save changes</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
